name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Test
        run: python -m unittest discover -s tests

      - name: Verify tag matches plugin version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match plugin.json version v$VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build artifacts
        run: python tools/build.py package

      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "See CHANGELOG.md") + """

          ## Install

          **Claude Code (plugin marketplace)**
          ```
          /plugin marketplace add d3vnmd/cluau
          /plugin install cluau@cluau
          ```

          **Claude.ai / Claude Desktop** — download `cluau-skill.zip` below → Settings → Capabilities → Skills → Upload.

          **Manual (Claude Code)** — unzip into `~/.claude/skills/` (personal) or `.claude/skills/` (project).
          """
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Cluau v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/cluau-skill-v${{ env.VERSION }}.zip
            dist/cluau-skill.zip
            dist/SHA256SUMS.txt
