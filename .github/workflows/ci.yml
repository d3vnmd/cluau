name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (frontmatter parsing)
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Unit tests (linter)
        run: python -m unittest discover -s tests -v

      - name: Theme presets (contrast, fonts, generated Luau in sync)
        run: python tools/build_themes.py --check

      - name: Skill check (frontmatter, links, manifests, clean templates)
        run: python tools/build.py check

      - name: Package dry run
        run: python tools/build.py package

      - name: Upload skill zip
        uses: actions/upload-artifact@v4
        with:
          name: cluau-skill
          path: dist/

  luau-syntax:
    name: Luau syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Luau toolchain
        run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/"*
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Compile every template (parse + bytecode)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if luau-compile --binary "$file" > /dev/null; then
              echo "ok   $file"
            else
              echo "FAIL $file"; status=1
            fi
          done < <(find skills/cluau/templates tests/luau -name '*.luau' -print0)
          exit $status

  docs-verify:
    name: API references exist in official Roblox docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Fetch Roblox/creator-docs (source of create.roblox.com)
        run: git clone --depth 1 https://github.com/Roblox/creator-docs "$RUNNER_TEMP/creator-docs"

      - name: Every Class:Member / Enum.X.Y in the skill must exist
        run: python tools/verify_api_refs.py "$RUNNER_TEMP/creator-docs"

  luau-tests:
    name: Luau unit tests (Lune)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lune
        id: cache-lune
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/lune
          key: lune-0.11.1-${{ runner.os }}

      - name: Install Lune 0.11.1
        if: steps.cache-lune.outputs.cache-hit != 'true'
        run: cargo install lune --locked --version 0.11.1

      - name: Run template specs
        run: ~/.cargo/bin/lune run tests/luau/run.luau
